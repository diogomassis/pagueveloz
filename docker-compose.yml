services:
  postgres:
    image: postgres:16-alpine
    container_name: pagueveloz-postgres
    environment:
      POSTGRES_DB: pagueveloz
      POSTGRES_USER: pagueveloz
      POSTGRES_PASSWORD: pagueveloz
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pagueveloz -d pagueveloz" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: pagueveloz-rabbitmq
    environment:
      RABBITMQ_ERLANG_COOKIE: paguevelozcookie
      RABBITMQ_DEFAULT_USER: pagueveloz
      RABBITMQ_DEFAULT_PASS: pagueveloz
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    command: [ "sh", "-c", "chown -R rabbitmq:rabbitmq /var/lib/rabbitmq || true; /usr/local/bin/docker-entrypoint.sh rabbitmq-server" ]

  redis:
    image: redis:7-alpine
    container_name: pagueveloz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  pagueveloz-app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pagueveloz-app-1
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__PagueVeloz: Host=postgres;Port=5432;Database=pagueveloz;Username=pagueveloz;Password=pagueveloz
      Messaging__RabbitMq__Host: rabbitmq
      Messaging__RabbitMq__Port: 5672
      Messaging__RabbitMq__Username: pagueveloz
      Messaging__RabbitMq__Password: pagueveloz
      Messaging__RabbitMq__Exchange: pagueveloz.transactions
      Cache__Redis__ConnectionString: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  pagueveloz-app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pagueveloz-app-2
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__PagueVeloz: Host=postgres;Port=5432;Database=pagueveloz;Username=pagueveloz;Password=pagueveloz
      Messaging__RabbitMq__Host: rabbitmq
      Messaging__RabbitMq__Port: 5672
      Messaging__RabbitMq__Username: pagueveloz
      Messaging__RabbitMq__Password: pagueveloz
      Messaging__RabbitMq__Exchange: pagueveloz.transactions
      Cache__Redis__ConnectionString: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  haproxy:
    image: haproxy:2.8-alpine
    container_name: pagueveloz-haproxy
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - pagueveloz-app-1
      - pagueveloz-app-2

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
